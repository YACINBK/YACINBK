<svg xmlns="http://www.w3.org/2000/svg" width="280" height="190" viewBox="0 0 280 190" role="img" aria-labelledby="title desc">
  <title id="title">Agentic Video Production Pipeline — View repository</title>
  <desc id="desc">Self-correcting generation. Resumes after interruption. Python · Playwright · FFmpeg.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f0c"/><stop offset="100%" stop-color="#111a12"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#00D8FF" stop-opacity="0.4"/><stop offset="100%" stop-color="#00D8FF" stop-opacity="0"/>
    </linearGradient>
    <style>@media (prefers-reduced-motion: reduce) { .ambient { display: none; } }</style>
  </defs>
  <rect width="280" height="190" rx="16" fill="#050705"/>
  <rect width="280" height="190" rx="16" fill="url(#bg)" opacity="0.5"/>
  <rect class="ambient" width="280" height="190" rx="16" fill="url(#glow)" opacity="0.12">
    <animate attributeName="opacity" values="0.06;0.18;0.06" dur="6s" repeatCount="indefinite"/>
  </rect>
  <rect x="12" y="12" width="256" height="166" rx="12" fill="none" stroke="#1f2b22"/>
  <path d="M28 12h42" stroke="#00D8FF" stroke-width="2" stroke-linecap="round" opacity="0.7"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="28" y="42" fill="#00D8FF" font-size="16" font-weight="700">Agentic Video</text>
    <text x="28" y="63" fill="#00D8FF" font-size="16" font-weight="700">Production Pipeline</text>
    <text x="28" y="85" fill="#8CA08A" font-size="10.5">Python · Playwright · FFmpeg</text>
    <text x="28" y="107" fill="#E5F5E5" font-size="11">Self-correcting generation.</text>
    <text x="28" y="123" fill="#E5F5E5" font-size="11">Resumes after interruption.</text>
    <rect x="26" y="138" width="228" height="28" rx="7" fill="#0e160f" stroke="#00D8FF" stroke-opacity="0.45"/>
    <text x="40" y="156" fill="#00D8FF" font-size="11" font-weight="600">View repository</text>
  </g>
  <path d="M229 148h9v9m0-9-9 9" fill="none" stroke="#00D8FF" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
