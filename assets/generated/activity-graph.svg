<svg xmlns="http://www.w3.org/2000/svg" width="860" height="284" viewBox="0 0 860 284" role="img" aria-labelledby="title desc">
  <title id="title">GitHub contribution rhythm</title>
  <desc id="desc">The contribution graph is waiting for its first successful GitHub Actions refresh.</desc>
  <rect width="860" height="284" rx="16" fill="#050705"/>
  <rect x="12" y="12" width="836" height="260" rx="12" fill="none" stroke="#1f2b22"/>
  <g font-family="Segoe UI, Inter, Arial, sans-serif">
    <text x="28" y="38" fill="#8FFF52" font-size="10" letter-spacing="2">// CONTRIBUTION RHYTHM</text>
    <text x="28" y="130" fill="#E5F5E5" font-size="20" font-weight="700">Awaiting the first successful refresh</text>
    <text x="28" y="160" fill="#8CA08A" font-size="13">The workflow will render your weekly contributions directly from GitHub.</text>
    <text x="28" y="262" fill="#8CA08A" font-size="11">Click to view contribution history on GitHub.</text>
  </g>
</svg>
