name: Refresh GitHub metrics

on:
  schedule:
    - cron: "23 */6 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/github-stats.yml
      - scripts/github_metrics.py
      - tests/test_github_metrics.py
      - README.md
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-metrics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the metrics generator
        run: python -m unittest discover -s tests -v

      - name: Generate metrics from GitHub's API
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_USERNAME: ${{ github.repository_owner }}
        run: |
          python scripts/github_metrics.py
          python scripts/github_metrics.py --activity

      - name: Save the successful refresh
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/generated/github-metrics.svg assets/generated/activity-graph.svg
          if git diff --staged --quiet; then
            echo "Metrics are unchanged."
            exit 0
          fi
          git commit -m "chore: refresh GitHub metrics [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${TARGET_BRANCH}"; then
              exit 0
            fi
            git fetch origin "${TARGET_BRANCH}"
            git rebase "origin/${TARGET_BRANCH}"
          done
          echo "Could not push the metrics update."
          exit 1
